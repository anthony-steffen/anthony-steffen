<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Sequência de contribuições de Anthony Steffen</title>
  <desc id="desc">815 contribuições no total, sequência atual de zero dias e maior sequência de 16 dias.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1597ff"/>
      <stop offset="0.55" stop-color="#30363d"/>
      <stop offset="1" stop-color="#914cff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1597ff"/>
      <stop offset="1" stop-color="#914cff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="218" rx="14" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <text x="28" y="34" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    Sequência de contribuições
  </text>
  <text x="792" y="34" fill="#2dd4bf" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">
    ASSET LOCAL
  </text>

  <line x1="265" y1="65" x2="265" y2="187" stroke="#30363d"/>
  <line x1="555" y1="65" x2="555" y2="187" stroke="#30363d"/>

  <text x="133" y="117" fill="#f4f7fb" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">815</text>
  <text x="133" y="145" fill="#c9d1d9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Total de contribuições</text>
  <text x="133" y="166" fill="#8b949e" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">31 de ago. de 2021 — presente</text>

  <circle cx="410" cy="117" r="52" fill="none" stroke="#222b38" stroke-width="9"/>
  <circle cx="410" cy="117" r="52" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="255 327" transform="rotate(-90 410 117)"/>
  <text x="410" y="126" fill="#f4f7fb" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">0</text>
  <text x="410" y="190" fill="#58a6ff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Sequência atual</text>

  <text x="688" y="117" fill="#f4f7fb" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">16</text>
  <text x="688" y="145" fill="#c9d1d9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Maior sequência</text>
  <text x="688" y="166" fill="#8b949e" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">15 de mai. — 30 de mai.</text>
</svg>
