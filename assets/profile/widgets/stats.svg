<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="title description">
  <title id="title">Estatísticas públicas de Anthony Steffen</title>
  <desc id="description">343 contribuições nos últimos 12 meses, 14 repositórios públicos e 4 projetos em destaque.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1597ff"/>
      <stop offset="1" stop-color="#914cff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="188" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="20" y="31" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Estatísticas gerais</text>
  <rect x="20" y="43" width="440" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="88" y="92" fill="#f4f7fb" font-size="30" font-weight="700">343</text>
    <text x="88" y="117" fill="#c9d1d9" font-size="13">Contribuições</text>
    <text x="88" y="137" fill="#8b949e" font-size="11">últimos 12 meses</text>

    <line x1="160" y1="67" x2="160" y2="145" stroke="#30363d"/>

    <text x="240" y="92" fill="#f4f7fb" font-size="30" font-weight="700">14</text>
    <text x="240" y="117" fill="#c9d1d9" font-size="13">Repositórios</text>
    <text x="240" y="137" fill="#8b949e" font-size="11">públicos</text>

    <line x1="320" y1="67" x2="320" y2="145" stroke="#30363d"/>

    <text x="392" y="92" fill="#f4f7fb" font-size="30" font-weight="700">4</text>
    <text x="392" y="117" fill="#c9d1d9" font-size="13">Destaques</text>
    <text x="392" y="137" fill="#8b949e" font-size="11">selecionados</text>
  </g>

  <text x="20" y="174" fill="#6e7681" font-family="Segoe UI, Arial, sans-serif" font-size="10">Atualizado em 29 jul. 2026</text>
</svg>
